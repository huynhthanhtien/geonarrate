name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Chỉ chạy phần bị ảnh hưởng; đổi backend/openapi.json (contract) → frontend cũng chạy lại
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'backend/openapi.json'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geonarrate
          POSTGRES_PASSWORD: geonarrate
          POSTGRES_DB: geonarrate_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U geonarrate -d geonarrate_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://geonarrate:geonarrate@localhost:5432/geonarrate_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff format --check . && ruff check .
      - run: mypy
      - run: lint-imports
      - run: pytest -q --cov=app --cov-report=term --cov-fail-under=85
      - name: Contract — openapi.json đã commit phải khớp code
        run: ./scripts/check_openapi.sh
      # Đổi API có chủ đích (vd. attraction → poi, bỏ slug): gắn nhãn `breaking-change` cho PR để bỏ qua bước này
      - name: Contract — không có breaking change so với nhánh đích
        if: >-
          github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'breaking-change')
        run: |
          git show origin/${{ github.base_ref }}:backend/openapi.json > /tmp/base.json 2>/dev/null || { echo "nhánh đích chưa có backend/openapi.json — bỏ qua"; exit 0; }
          docker run --rm -v /tmp:/base -v "$PWD":/head tufin/oasdiff breaking /base/base.json /head/openapi.json --fail-on ERR

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: api-client phải khớp backend/openapi.json
        run: pnpm api:generate && git diff --exit-code -- packages/api-client/src
      # PR: chỉ chạy package bị ảnh hưởng; push main: chạy hết
      - run: pnpm turbo run typecheck test build --filter='...[origin/${{ github.base_ref }}]'
        if: github.event_name == 'pull_request'
      - run: pnpm turbo run typecheck test build
        if: github.event_name == 'push'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with: { name: web-dist, path: frontend/apps/web/dist }

  # Check duy nhất cần đặt "required" trong branch protection: luôn chạy, coi job bị skip là đạt
  ci-ok:
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }}"
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
