# Hạ tầng local cho dev: PostgreSQL 16 + PostGIS + Redis 7
name: geonarrate
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geonarrate
      POSTGRES_PASSWORD: geonarrate  # chỉ dùng cho dev
      POSTGRES_DB: geonarrate_dev
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/20-test-db.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geonarrate -d geonarrate_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
  redis-data:
